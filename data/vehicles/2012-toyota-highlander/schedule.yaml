# 2012 Toyota Highlander SE AWD, 2GR-FE 3.5L V6, U660E 6-speed automatic.
# Intervals below are Toyota's NORMAL-schedule specs. Toyota's maintenance
# booklet sets a 5,000 mi / 6 mo "service rhythm" (tire rotation + fluid/
# filter checks at every visit), but that does NOT mean an oil-and-filter
# change every visit — with 0W-20 full synthetic the 2GR-FE's actual oil
# change interval is 10,000 mi / 12 mo under normal use. Severe-duty figures
# (frequent short trips, dusty/stop-and-go driving, towing) are noted where
# they differ, but the numeric interval here is the normal one.
#
# Sources (verified 2026-07-16, re-audited against the primary document text):
#  - Toyota Warranty & Maintenance Guide, Highlander (2013 model year guide,
#    same 2GR-FE/U660E powertrain as this 2012; assets.sia.toyota.com
#    T-MMS-13Highlander/pdf/2013_Toyota_Highlander_WMG.pdf) — downloaded and
#    read directly (Schedule B, V6 Engines tables + "Explanation of
#    Maintenance Items" section) rather than trusted via aggregator summary.
#  - Toyota official oil-change-interval clarification, confirmed in the WMG
#    itself: "For VEHICLES CERTIFIED FOR 0W20 motor oil, the oil change
#    interval is 10,000 miles or 12 months IF 0W20 MOTOR OIL IS BEING USED."
#    The 5,000 mi figure is the fluid-check/rotation rhythm, or the severe-
#    duty oil interval.
#  - Aggregated dealer maintenance-schedule pages (Toyota of Des Moines,
#    Galaxy Toyota, KBB) used only as secondary cross-checks, not primary
#    sourcing, for transmission/differential community-interval framing.
#
# 2026-07-16 audit corrections against the primary WMG PDF text:
#  - cabin-air-filter was wrong: file previously said 15,000 mi/12 mo
#    (aggregator-sourced); the actual WMG places "Replace cabin air filter"
#    only at the 30,000/60,000/90,000/120,000 mi (36/72/108/144 mo) service
#    points for both Schedule A and B. Corrected to 30,000 mi/36 mo.
#  - engine-air-filter mileage (30,000 mi) was already correct but
#    intervalMonths was null; the WMG lists it at "30,000 miles or 36
#    months" (recurring), so intervalMonths corrected to 36.
#  - brake-fluid-flush previously implied a "Toyota time-based, every 3
#    years" factory spec; the WMG for this vehicle contains no scheduled
#    brake-fluid replacement item at all (inspection of "brake lines and
#    hoses" only). Re-labeled as a community-sourced estimate, no Toyota
#    citation exists for this vehicle.
#  - coolant-flush recurring time figure (60 mo) was previously a derived/
#    estimated value; a literal Toyota footnote in this WMG was located
#    confirming it directly ("Initial replacement at 100,000 miles/120
#    months. Replace every 50,000 miles/60 months thereafter.") — no longer
#    a derivation.
#  - spark-plugs (120,000 mi/144 mo) confirmed directly against the WMG's
#    Schedule B V6 table; the alternate 60,000 mi figure floating around
#    dealer sites does not appear anywhere in Toyota's own document for this
#    powertrain.
#  - oil-change, tire-rotation, multi-point-inspection, brake-inspection,
#    transmission-fluid-service, rear-diff-transfer-case (including the
#    front-vs-rear 30k/15k inspection split) were all independently
#    re-checked against the WMG tables and are unchanged — figures were
#    already correct.
#
# Prior version of this file used a 5,000 mi oil-change interval sourced from
# SEO round-up sites that don't distinguish the service rhythm from the
# actual oil-change interval; corrected in an earlier pass.
items:
  - itemType: oil-change
    name: >-
      Oil & filter change (0W-20 full synthetic, ~6.4 qt) — Toyota normal
      10,000 mi/12 mo. BRADY'S POLICY (2026-07-16): every car in the fleet
      gets a minimum of 2 oil changes/year regardless of mileage (spring
      tune-up + fall oil change) — 6 mo below reflects that standing
      policy, not Toyota's own 12 mo normal-schedule allowance.
    intervalMiles: 10000
    intervalMonths: 6
    service:
      fluids:
        - name: Engine oil
          grade: 0W-20 full synthetic
          capacity: 6.1 L (6.4 US qt) with filter change
          notes: Confirmed directly in the 2GR-FE FSM lubrication chapter, LU-6.
      parts:
        - name: Oil filter
          oemPartNumber: 04152-YZZA1
          aftermarketCrosses: [WIX 57047, Purolator PureOne PL25608, Denso 150-3021]
          lastPurchase:
            date: '2026-09-16'
            source: Amazon, NewYall 2-pack with O-rings included
            price: 4.50
            quantity: 2
          notes: Cartridge element, requires new housing O-rings each service.
        - name: Oil filter housing O-rings
          singleUse: true
          notes: Included in the NewYall 2-pack purchased with the filter above.
        - name: Oil drain plug washer
          oemPartNumber: 90430-12031
          singleUse: true
          notes: Aluminum crush washer, shared with the Lexus ES 300h.
      tools:
        - Spurtar 64mm, 4-slot, 14-flute cap wrench. Does not fit a spin-on filter.
      notes:
        - Oil filter cap torque 25 N·m (18 ft-lb).
        - Oil filter housing internal drain plug torque 12.5 N·m (9 ft-lb).
        - Main oil pan drain plug torque 40 N·m (30 ft-lb).
      sources:
        - Toyota 2GR-FE FSM, Lubrication chapter (LU-3 to LU-7), engine-level document not Highlander-badged
  - itemType: tire-rotation
    name: Tire rotation — Toyota's standard 5,000 mi/6 mo service rhythm
    intervalMiles: 5000
    intervalMonths: 6
    service:
      parts:
        - name: Tires
          notes: >-
            OEM size P245/65R17 105S, confirmed via Toyota Tires,
            BFGoodrich, and Wheel-Size.com fitment tools. Cold pressure
            30 psi front and rear for SE trim per a secondary aggregator
            (tirepressure.org), not Toyota's own placard, confirm against
            the door jamb sticker. Lug nut torque 76 ft-lb, consistent
            across independent aggregators, not FSM-confirmed.
      sources:
        - Toyota Tires and BFGoodrich fitment tools; tirepressure.org; 21cylinders.com and lugnutspecs.com (lug torque)
  - itemType: multi-point-inspection
    name: Multi-point inspection / fluid level checks — with each 5,000 mi service
    intervalMiles: 5000
    intervalMonths: 6
  - itemType: cabin-air-filter
    name: >-
      Cabin air filter — Toyota normal-schedule 30,000 mi/36 mo (confirmed
      in 2013 Highlander WMG Schedule A/B tables). UPDATED 2026-07-22:
      Hera runs a K&N washable/reusable cabin air filter (VF2000), washed
      every spring rather than replaced on Toyota's mileage interval —
      confirmed clean and working as of 2026-07-22 (a 2024-05-15 wash is
      logged, but not itemType-tagged, which made this look overdue by
      the schedule's automated calculation — it isn't). Brady plans to
      switch to disposable filters starting spring 2027 (see tasks.yaml).
    intervalMiles: 30000
    intervalMonths: 36
    service:
      parts:
        - name: Cabin air filter, disposable (for the spring 2027 switch)
          oemPartNumber: 87139-YZZ10
          aftermarketCrosses: [87139-YZZ92]
          notes: Not needed yet, Hera currently runs a washable K&N filter (VF2000).
      sources:
        - parts.toyota.com product listing for the 2012 Highlander
  - itemType: engine-air-filter
    name: >-
      Engine air filter — Toyota normal-schedule 30,000 mi/36 mo (confirmed
      in 2013 Highlander WMG Schedule A/B tables). UPDATED 2026-07-22:
      Hera runs a K&N washable/reusable engine air filter (33-2260), washed
      every spring rather than replaced on Toyota's mileage interval —
      confirmed clean and working as of 2026-07-22 (same 2024-05-15
      untagged wash and same automated-overdue-flag caveat as the cabin
      filter above). Brady plans to switch to disposable filters starting
      spring 2027 (see tasks.yaml).
    intervalMiles: 30000
    intervalMonths: 36
    service:
      parts:
        - name: Engine air filter, disposable (for the spring 2027 switch)
          oemPartNumber: 17801-31141
          aftermarketCrosses: [17801-YZZ14]
          notes: >-
            17801-31141 is dated specifically to 2012-2015 Highlander;
            17801-YZZ14 covers 2011-2016 and may also cross-reference.
            Verify by VIN at the parts counter before ordering in 2027.
            Not needed yet, Hera currently runs a washable K&N filter
            (33-2260).
      sources:
        - Toyota dealer parts catalog listings (Smithtown Toyota, Toyota Parts Delivered, Desert Toyota of Tucson)
  - itemType: brake-inspection
    name: Brake inspection (pads/rotors) — with each service
    intervalMiles: 5000
    intervalMonths: 6
  - itemType: brake-fluid-flush
    name: >-
      Brake fluid — Toyota's own Warranty & Maintenance Guide for this
      vehicle does NOT list a scheduled brake-fluid replacement item at all
      (only visual "brake lines and hoses" inspection); there is no fixed
      Toyota factory interval to cite here. UPDATED 2026-07-22: Brady's
      actual practice supersedes the calendar-estimate approach entirely.
      He tests the fluid's chemical condition twice yearly (spring and
      fall) with Phoenix Systems 8006-B strips and replaces it only if a
      test fails, never on a fixed calendar interval.
      RESTRUCTURED 2026-08-14: the test now has its own brake-fluid-test
      item below, mirroring how battery-test is kept separate from
      battery-12v. This entry is a REPLACEMENT record only and carries no
      interval, since Toyota specifies none. Previously this item held a
      6-month interval so that strip-test results could be logged against
      it, which made a passed test render as though the fluid had been
      flushed. A "never logged" state here means no flush has ever been
      recorded, which is NOT the same as one being due. The strip test
      decides that, and its results now live on the test item.
    intervalMiles: null
    intervalMonths: null
    service:
      fluids:
        - name: Brake fluid
          grade: SAE J1703 / FMVSS 116 DOT 3
      sources:
        - tohighlander.com mirrored owner's manual content
  - itemType: brake-fluid-test
    name: >-
      Brake fluid condition test (Phoenix Systems 8006-B strips) — ADDED
      2026-08-14. Brady tests every vehicle in the fleet twice yearly,
      spring and fall, and replaces the fluid only on a failed result.
      The 8006-B strips are double-ended, so the same strip covers the
      coolant test below and the two are normally done in one session.
    intervalMiles: null
    intervalMonths: 6
  - itemType: coolant-flush
    name: >-
      Engine coolant (Toyota Super Long Life Coolant, pink) — FIRST change
      100,000 mi/120 mo, then every 50,000 mi/60 mo thereafter. Confirmed by
      a literal citation in the 2013 Highlander Warranty & Maintenance
      Guide footnote: "Initial replacement at 100,000 miles/120 months.
      Replace every 50,000 miles/60 months thereafter." UPDATED 2026-07-22:
      Brady's actual practice supersedes the calendar-estimate approach.
      He tests the coolant's chemical condition twice yearly (spring and
      fall) with Phoenix Systems strips alongside the brake fluid test
      above, and replaces it only if a test fails, not on Toyota's
      calendar interval.
      RESTRUCTURED 2026-08-14: the test now has its own coolant-test item
      below. This entry is an informational REPLACEMENT record with no
      computed due date, exactly like battery-12v. Toyota's figures stay
      documented in this text but are deliberately NOT set as intervals
      below, because computing against them would flag this row on the
      calendar while the actual fluid has passed a strip test. A "never
      logged" state here is not evidence a flush is due.
    intervalMiles: null
    intervalMonths: null
  - itemType: coolant-test
    name: >-
      Engine coolant condition test (Phoenix Systems 8006-B strips) —
      ADDED 2026-08-14. Twice yearly, spring and fall, same session and
      same double-ended strip as the brake fluid test above. Replacement
      is decided by the result, not by age or mileage.
    intervalMiles: null
    intervalMonths: 6
  - itemType: transmission-fluid-service
    name: >-
      Transmission fluid (U660E, Toyota WS ATF) — no fixed normal-use
      interval in Toyota's guide (fill-for-life under normal conditions);
      Toyota's severe-duty schedule calls for a drain-and-fill around 60,000
      mi, which is the reasonable proactive interval for a car with unknown
      prior fluid history like this one. COMMUNITY NOTE: Toyota techs
      commonly recommend proactive changes every 60,000-100,000 mi on any
      "sealed"/lifetime Toyota transmission regardless of official stance;
      some Highlander owners report noticeably cleaner fluid doing it every
      25,000-30,000 mi. 60,000 mi below is a reasonable middle ground given
      unknown history.
    intervalMiles: 60000
    intervalMonths: null
    service:
      fluids:
        - name: Transmission fluid
          grade: Toyota Genuine ATF WS
          notes: >-
            Confirmed by Toyota TSB T-SB-0036-13 Rev2, which explicitly
            lists 2009-2016 Highlander with U660E + 2GR-FE + AWD. The
            U660E has no dipstick: level is set warm (185-194°F) via an
            overflow/drain plug at 75.5mm (600-700 RPM idle) or 72.0mm
            (700-800 RPM idle), using Toyota's SST vacuum-gauge tool
            (P/N 10002-00101). Toyota does not publish a drain-and-fill
            quart figure since the fill method is level-based, not
            volume-based; forum reports of "3.7 qt" are field
            measurements, not a spec. Without the dealer SST kit, a DIY
            drain-and-fill can get close by measuring what drains out,
            but cannot verify against Toyota's actual level spec.
      notes:
        - Overflow/drain plug torque 40 N·m (30 ft-lb).
        - Refill plug torque 49 N·m (36 ft-lb).
      sources:
        - Toyota TSB T-SB-0036-13 Rev2, "WS ATF Level Adjustment for U660E/F & U760E/F Transmissions"
  - itemType: spark-plugs
    name: >-
      Spark plugs (iridium, 2GR-FE V6) — confirmed directly in the 2013
      Highlander Warranty & Maintenance Guide, Schedule B (V6 engines):
      "Replace spark plugs" appears only at the "120,000 miles or 144
      months" service table. (Some dealer/aggregator pages cite 60,000 mi;
      that figure does not appear in Toyota's own document for this
      powertrain and is disregarded here.)
    intervalMiles: 120000
    intervalMonths: 144
    service:
      parts:
        - name: Spark plugs
          oemPartNumber: 90919-01247 (Denso FK20HR11)
          quantityPerService: 6
          notes: >-
            Gap 1.0-1.1 mm (0.039-0.043 in) new, ships pre-gapped, do
            not re-gap unless checking wear (max 1.4 mm). Torque is an
            unresolved conflict between two tables in the same FSM
            mirror: 18 N·m/13 ft-lb (Engine Mechanical) vs 25 N·m/18
            ft-lb (Ignition). Check the torque printed on the OEM Denso
            plug's own packaging before guessing; overtorquing a 14mm
            plug into an aluminum head risks thread damage.
      sources:
        - Toyota 2GR-FE Ignition Service Specifications, SS-38/SS-39; Engine Mechanical Service Specifications, SS-23
  - itemType: front-differential-fluid
    name: >-
      Front differential fluid (AWD) — SPLIT 2026-07-28 from a combined
      "front/rear differential + transfer case" item, per Brady: each
      fluid now gets its own line so none of the three can be silently
      skipped. Toyota AWD Highlander normal schedule: inspect every
      30,000 mi/36 mo, replace only if contaminated/severe use (severe:
      replace every 15,000 mi; no fixed normal-use replacement interval).
      Forum consensus for proactive replacement (not just inspection) is
      every 20,000-30,000 mi given this car's high mileage and unknown
      prior service.
    intervalMiles: 30000
    intervalMonths: 36
    service:
      notes:
        - >-
          IMPORTANT: on this AWD platform the front final drive is
          integrated into the transaxle case and shares the
          transmission's Toyota WS ATF. There is no separate
          serviceable front differential fluid or fill point the way a
          body-on-frame 4x4 has one. This item may be redundant with
          the transmission-fluid-service item above, flagged for Brady
          to review rather than silently merged.
      sources:
        - toyota-club.net factory-derived fluid/capacity table, 2007-2014 Highlander (XU40)
  - itemType: rear-differential-fluid
    name: >-
      Rear differential fluid (AWD) — SPLIT 2026-07-28 from a combined
      "front/rear differential + transfer case" item, per Brady: each
      fluid now gets its own line so none of the three can be silently
      skipped. Toyota's own manual specifies a MORE FREQUENT inspection
      here than the old combined item reflected — every 15,000 mi/18 mo
      under normal use (severe: replace every 15,000 mi; no fixed
      normal-use replacement interval). Forum consensus for proactive
      replacement (not just inspection) is every 20,000-30,000 mi given
      this car's high mileage and unknown prior service.
    intervalMiles: 15000
    intervalMonths: 18
    service:
      fluids:
        - name: Rear differential fluid
          grade: Hypoid gear oil GL-5, 80W or 80W-90
          capacity: 0.9 L
          notes: >-
            Confirmed for the correct 2007-2014 (XU40) generation.
            Newer 2014-2019 (XU50) Highlanders use a different spec
            (75W-85 GL-5 LX, 0.5 L), do not use that figure for this car.
      sources:
        - toyota-club.net factory-derived fluid/capacity table, 2007-2014 Highlander (XU40)
  - itemType: transfer-case-fluid
    name: >-
      Transfer case fluid (AWD power transfer unit) — SPLIT 2026-07-28
      from a combined "front/rear differential + transfer case" item,
      per Brady: each fluid now gets its own line so none of the three
      can be silently skipped. Same Toyota inspection interval as the
      rear differential above — every 15,000 mi/18 mo under normal use
      (severe: replace every 15,000 mi; no fixed normal-use replacement
      interval). Forum consensus for proactive replacement (not just
      inspection) is every 20,000-30,000 mi given this car's high mileage
      and unknown prior service.
    intervalMiles: 15000
    intervalMonths: 18
    service:
      fluids:
        - name: Transfer case fluid (power transfer unit)
          grade: Hypoid gear oil GL-5, 80W or 80W-90
          capacity: 0.9 L
          notes: Same spec and generation caveat as the rear differential fluid above.
      sources:
        - toyota-club.net factory-derived fluid/capacity table, 2007-2014 Highlander (XU40)
  - itemType: battery-test
    name: >-
      12V battery load test (KONNWEI KW208 tester) — UPDATED 2026-07-22:
      Brady tests twice yearly (spring & fall), not annually, and records
      the CCA/SOH/SOC result each time. Replacement is decided by the
      test result, not by the battery's age — see battery-12v below,
      which is now informational only.
    intervalMiles: null
    intervalMonths: 6
  - itemType: battery-12v
    name: >-
      12V battery replacement — last replaced 2024-02-19. CORRECTED
      2026-07-22: this is an informational "last replaced" record only,
      NOT a schedule-driven due date — Brady explicitly does not want a
      replacement flagged just because the battery has crossed a generic
      age estimate. Replacement happens only when the twice-yearly KW208
      test (see battery-test above) indicates it's needed.
    intervalMiles: null
    intervalMonths: null
    service:
      parts:
        - name: 12V battery
          notes: >-
            Group 24F, 530 CCA for the 3.5L V6 (not the 4-cylinder or
            hybrid variants), per retailer fitment cross-reference
            (O'Reilly, AutoZone), not a Toyota FSM electrical spec page.
            No confident single OEM 28800-series part number found.
            Simplest path: read the group size/CCA off whatever battery
            is currently installed, or ask a parts counter for the 2012
            Highlander 3.5L-specific listing directly.
      sources:
        - O'Reilly Auto Parts and AutoZone retailer fitment databases
  - itemType: wiper-blades
    name: >-
      Wiper blades — Brady checks these every spring during the seasonal
      tune-up, but only actually replaces them roughly every other year
      once they get streaky (sometimes sooner if damaged). 24 mo below
      reflects the real replacement cadence, not the annual spring check.
    intervalMiles: null
    intervalMonths: 24
