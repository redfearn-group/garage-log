# 2019 Lexus ES 300h, A25A-FXS 2.5L hybrid, eCVT.
#
# Source (re-verified 2026-07-16, primary document): 2020 Lexus ES 300h
# Warranty & Services Guide, official Lexus/Toyota PDF
# (assets.sia.toyota.com, L-MMS-20ES300h) — the Scheduled Maintenance Log
# table (pages 48-67) and Explanation of Maintenance Items (pages 68-72).
# CORRECTION: this file previously cited the 2016 ES 300h WSG
# (L-MMS-16ES300H) as "same generation" — that is WRONG. The 2016 ES 300h
# is 6th-gen (2013-2018) with the 2AR-FXE 2.5L engine and 0W-20 oil spec.
# The 2019 car is 7th-gen (2019-2024) with the all-new A25A-FXS engine
# and a 0W-16 oil spec, plus a factory HV-battery-cooling-filter check
# that doesn't exist on the 6th-gen schedule at all. The 2020 MY document
# used now IS the same 7th-gen A25A-FXS/eCVT platform as this 2019 car,
# and Lexus does not change this schedule within a generation, so it
# applies directly. All intervals below are read directly off that table,
# not aggregated from third-party sites. Despite the wrong source doc,
# nearly all the interval NUMBERS below already matched (Lexus kept the
# same visit rhythm across generations) — the exceptions are noted at the
# relevant items below.
#
# The Lexus schedule has a 6 mo/5,000 mi "visit rhythm" (fluid checks,
# tire rotation, brake/wiper inspection at EVERY visit) that is separate
# from the oil-change interval — do not confuse the two. Oil/cabin filter
# are changed at every OTHER visit (12 mo/10,000 mi), matching engine
# air filter/brake fluid at every 6th visit (36 mo/30,000 mi), etc.
items:
  - itemType: oil-change
    name: >-
      Oil & filter change (0W-16 full synthetic — SAE 0W-20 is an
      acceptable substitute only until the next change, per the 2020
      ES 300h WSG; verify capacity/filter part at parts counter) — Lexus
      normal 12 mo/10,000 mi (NOT the 6 mo/5,000 mi visit rhythm, which
      is a fluid-check/rotation visit, not necessarily an oil change).
      BRADY'S POLICY (2026-07-16): every car in the fleet gets a minimum
      of 2 oil changes/year regardless of mileage (spring tune-up + fall
      oil change) — 6 mo below reflects that standing policy, not Lexus's
      own 12 mo normal-schedule allowance.
    intervalMiles: 10000
    intervalMonths: 6
    service:
      fluids:
        - name: Engine oil
          grade: 0W-16 full synthetic
          certifications: [API SP, ILSAC GF-6B]
          capacity: 4.8 qt with filter change. Buy a 5 qt jug.
          notes: >-
            The bottle must state ILSAC GF-6B, not just the 0W-16 viscosity
            number. 0W-20 is Lexus's own approved one-time substitute only,
            revert to 0W-16 at the next change. Super Tech Full Synthetic
            0W-16 (Walmart) and Mobil 1 Advanced Fuel Economy 0W-16 both
            meet this spec.
      parts:
        - name: Oil filter
          oemPartNumber: 90915-YZZN1
          aftermarketCrosses: [Fram PH4967]
          avoid: [Fram Ultra line]
          quantityPerService: 1
          lastPurchase:
            date: '2026-09-16'
            source: Lexus dealer, online order with local parts-counter pickup
            price: 5.26
            quantity: 4
          notes: >-
            Denso-made spin-on canister, supersedes 90915-YZZF2 and
            90915-YZZM1. Lexus also catalogs the cartridge-element
            04152-YZZA1 for this model. RESOLVED 2026-09-16: 04152-YZZA1
            is the cartridge filter for the 2GR-FE/2GR-FKS V6 family
            (Highlander, RX 350, and the gasoline ES 350 that shares
            this car's body/chassis catalog), not the A25A-FXS hybrid
            four-cylinder. The spin-on 90915-YZZN1 above is correct for
            this engine, corroborated by the mechanically identical
            Camry Hybrid's own parts listings. A spin-on canister is a
            smooth cylinder that unscrews as a whole; a cartridge is a
            squarish cap with a hex bolt on top while the housing stays
            on the block, a glance under the hood confirms it either way.
        - name: Oil drain plug washer
          oemPartNumber: 90430-12031
          singleUse: true
          notes: Aluminum crush washer, shared with the Highlander.
      tools:
        - >-
          Strap wrench removes this filter. A Toyota cartridge-cap wrench
          (e.g. Spurtar 64mm) does not fit, that's for a different Toyota
          filter housing design.
      notes:
        - >-
          After the service, reset the dash light through the touchscreen:
          Settings > Vehicle Settings > Schedule Maintenance > Reset Oil
          Maintenance > Yes.
      sources:
        - 2020 Lexus ES 300h Warranty & Services Guide (assets.sia.toyota.com, L-MMS-20ES300h)
        - parts.lexus.com, 90915-YZZN1 product page
  - itemType: tire-rotation
    name: Tire rotation — done at every scheduled visit, 6 mo/5,000 mi
    intervalMiles: 5000
    intervalMonths: 6
    service:
      parts:
        - name: Tires
          notes: >-
            Two possible factory configs, confirmed via the owner's
            manual (OM33E25U, pp. 399-400): 17" wheel, 215/55R17 94V,
            cold pressure 36 psi front and rear; or 18" wheel, 235/45R18
            94V, cold pressure 35 psi front and rear. Which applies to
            this VIN isn't settled here, check the sidewall size or
            door-jamb placard. Lug nut torque 103 N·m (76 ft-lb),
            consistently cited across secondary sources, not confirmed
            against a primary Lexus torque table.
      sources:
        - 2019 ES 300h Owner's Manual (OM33E25U), pp. 399-400
  - itemType: brake-inspection
    name: Visual brake pad/caliper/rotor inspection — done at every scheduled visit, 6 mo/5,000 mi
    intervalMiles: 5000
    intervalMonths: 6
  - itemType: wiper-blades
    name: Wiper blade inspection — done at every scheduled visit, 6 mo/5,000 mi; replace when cracked/streaking
    intervalMiles: 5000
    intervalMonths: 6
    service:
      parts:
        - name: Wiper blades
          notes: >-
            Front only, no rear wiper on the sedan body. Driver/left
            (26 in): 85222-06240. Passenger/right (18 in): 85212-06240.
            Confirmed via parts.lexus.com listings for the 2019 ES 300h.
      sources:
        - parts.lexus.com wiper blade listings
  - itemType: cabin-air-filter
    name: >-
      Cabin air filter (871390E040, CORRECTED 2026-09-16 from
      87139-YZZ20, which is genuine but fits the NX 300/RX 350, not
      this car) — replaced at the same 12 mo/10,000 mi cadence as the
      oil change
    intervalMiles: 10000
    intervalMonths: 12
    service:
      parts:
        - name: Cabin air filter
          oemPartNumber: 871390E040
          notes: >-
            Confirmed via parts.lexus.com for the 2019 ES 300h. Lexus
            also lists equipment-specific variants for Boost-audio
            (87139YZZ37/93) and nanoe air-refiner (8713958010) cars,
            confirm against this VIN at the parts counter before
            ordering. No confirmed aftermarket cross found this session.
      sources:
        - parts.lexus.com, 871390E040 product listing for the 2019 ES 300h
  - itemType: engine-air-filter
    name: >-
      Engine air filter (17801-F0020, CORRECTED 2026-09-16 from
      17801-31110, which is genuine but fits the GS 350/IS 250/IS 350,
      not this car) — Lexus 36 mo/30,000 mi
    intervalMiles: 30000
    intervalMonths: 36
    service:
      parts:
        - name: Engine air filter
          oemPartNumber: 17801-F0020
          aftermarketCrosses: [1780177050]
          notes: >-
            Denso-made, confirmed via parts.lexus.com and Toyota's own
            autoparts.toyota.com listing for the 2019 ES 300h. Since
            Denso is the OEM manufacturer here, there's no separate
            third-party aftermarket option worth chasing.
      sources:
        - parts.lexus.com and autoparts.toyota.com listings for the 2019 ES 300h
  - itemType: brake-fluid-flush
    name: >-
      Brake fluid replacement — Lexus 36 mo/30,000 mi, whichever occurs
      first (not purely time-based). RESTRUCTURED 2026-08-14: this is an
      informational REPLACEMENT record with no computed due date, like
      battery-12v, and the three dealer flushes logged against it are
      genuine flushes. Brady decides future replacement from the
      twice-yearly strip test on the brake-fluid-test item below, so the
      Lexus figures stay documented in this text rather than being set as
      intervals that would flag the row on the calendar while the fluid
      itself has passed a test.
    intervalMiles: null
    intervalMonths: null
    service:
      fluids:
        - name: Brake fluid
          grade: SAE J1703 / FMVSS 116 DOT 3
          notes: >-
            This is Toyota's actual factory fill, not just what the cap
            accepts. The reservoir cap is dual-marked "DOT 3 or DOT 4,"
            so DOT 4 is an acceptable top-up, but DOT 3 is delivered new.
      sources:
        - Toyota genuine brake fluid listing, part 00475-1BF03, autoparts.toyota.com
  - itemType: brake-fluid-test
    name: >-
      Brake fluid condition test (Phoenix Systems 8006-B strips) — ADDED
      2026-08-14. Brady tests every vehicle in the fleet twice yearly,
      spring and fall, and replaces the fluid only on a failed result.
      The 8006-B strips are double-ended, so one strip covers both this
      and the engine coolant test, normally done in the same session.
      First result on this car is the 2026-07-31 session, where both ends
      of the strip were used.
    intervalMiles: null
    intervalMonths: 6
  - itemType: engine-coolant-flush
    name: >-
      Engine coolant (Toyota Super Long Life Coolant, pink/50-50) —
      Lexus figures are a FIRST replacement at 120 mo/100,000 mi, then
      every 60 mo/50,000 mi thereafter. Separate system from inverter
      coolant below.
      CORRECTED 2026-08-14: replacement on this car is driven by TEST
      RESULT, not by that age/mileage figure, exactly as the 12V battery
      is driven by its load test rather than its age. Brady strip-tested
      the coolant on 2026-07-31 at 112,288 mi and it came back in
      excellent condition, so no flush is warranted despite the car
      sitting past the 100,000 mi first-replacement point with no flush
      anywhere in its records. Do NOT read a "never logged" state here as
      overdue. Absence of a flush record is not evidence the fluid is
      degraded, and a direct condition test is the more accurate measure
      of both. See the coolant-test item below for the testing cadence
      and maintenance-log.yaml for results. Lexus's figures stay
      documented in this text but are deliberately NOT set as intervals
      below, matching battery-12v, so this row never computes a due date
      off the calendar while the fluid itself has passed a strip test.
    intervalMiles: null
    intervalMonths: null
    service:
      fluids:
        - name: Engine coolant
          grade: Toyota Super Long Life Coolant, pink, 50/50 pre-diluted
          capacity: >-
            Not confirmed to a primary Lexus source. A secondary
            aggregator (same A25A-FXS platform) cites 7.6 qt (7.2 L)
            engine coolant separate from 3.4 qt (3.2 L) inverter
            coolant. Only matters for a full drain-refill, not a level
            top-up, which is checked to the reservoir F/L marks.
      sources:
        - 2020 ES 300h Warranty and Services Guide, "Engine and Inverter Coolants" section
  - itemType: coolant-test
    name: >-
      Engine coolant condition test (test strips) — ADDED 2026-08-14:
      Brady tests coolant condition directly rather than replacing on a
      generic interval, the same method he applies to the 12V battery
      via the KONNWEI KW208. Twice yearly, spring and fall, matching his
      other test-based checks. Replacement is decided by the strip
      result, not by age or mileage.
    intervalMiles: null
    intervalMonths: 6
  - itemType: inverter-coolant-flush
    name: >-
      Inverter coolant (same Toyota Super Long Life Coolant spec,
      separate reservoir/system from engine coolant) — FIRST replacement
      at 180 mo/150,000 mi, then every 60 mo/50,000 mi thereafter. The
      interval below (50,000 mi/60 mo) is the RECURRING figure that
      applies once the first service is logged — the true first-due point
      is the higher 150,000 mi/180 mo figure, but this app always computes
      the next due point as last-logged + this interval, so the recurring
      number belongs here, not the first-occurrence one. No due-mileage is
      shown at all until the first entry is logged, so this doesn't cause
      premature nagging before the real first-due point.
    intervalMiles: 50000
    intervalMonths: 60
  - itemType: transmission-fluid-service
    name: >-
      eCVT transaxle — Lexus states the transaxle and its fluid are a
      SEALED unit with NO scheduled fluid check or replacement, and there
      is no dipstick. The only manufacturer-specified service is a visual
      leak inspection of the transaxle/front differential case, which
      appears on the schedule every 30,000 mi/36 mo (36, 72, 108... mo —
      corrected from a prior transcription error that said "18, 36,
      54... mo"; the leak check does NOT appear on the 18-month/15,000-mi
      visit or other non-36-month-multiple visits, only every 3rd year).
      This entry tracks that leak inspection — it is NOT a fluid change
      interval. Any proactive fluid drain-and-fill some owners perform is
      outside Lexus's specification, not a manufacturer requirement.
      COMMUNITY NOTE: the "sealed" stance is genuinely contested even among
      Toyota/Lexus techs, and forum-reported independent practice ranges
      60,000-90,000 mi (or 6-9 yr) using Toyota ATF-WS. Some dealer service
      managers refuse to touch it at all, arguing a change can disturb
      debris and cause more harm than leaving it alone on a high-mileage,
      unknown-history unit — so this is a genuine judgment call, not a
      clear-cut community consensus like the other vehicles' fluids.
      UNCONFIRMED CLAIM (flagged, not stated as fact): forum posts widely
      repeat a figure of "Toyota Canada: 72 mo/96,000 km (~60,000 mi)" for
      the mechanically-related Camry Hybrid transaxle. THREE separate
      research passes (the third on 2026-07-16, with working web access)
      have tried and failed to find this figure in any primary Toyota
      Canada document. The 2026-07-16 pass directly pulled and full-text
      searched the 2019 Camry Hybrid US Warranty & Maintenance Guide
      (assets.sia.toyota.com, T-MMS-19CamryHV — same generation/platform,
      same transaxle family as this car) and found ONLY the identical
      "inspect sealed transmissions... for signs of leakage" language at
      every service interval, with no numbered fluid-change mileage/month
      figure anywhere in the document. Toyota Canada guides for the same
      model year are normally near-identical in content to the US guide
      (same maintenance log structure, just bilingual), which is evidence
      AGAINST a materially different hard-interval figure existing in the
      Canadian version, though a genuine Toyota Canada document was still
      not directly located/read to confirm or deny this one way or the
      other. No credible primary source (Toyota Canada PDF, JDM manual, or
      other market's factory schedule) was found for ANY hybrid transaxle
      fluid change interval on this transaxle family — only unsourced
      forum claims and independent shops' own recommendations (e.g. one
      Japanese tire/service shop's page recommending 40,000 km on its own
      authority, not citing any Toyota document). Treat the 72mo/96,000km
      figure as an unverified forum claim, not a confirmed fact, until
      someone locates and reads the actual source document.
    intervalMiles: 30000
    intervalMonths: 36
  - itemType: spark-plugs
    name: >-
      Spark plugs (iridium, part 90919-01289, CORRECTED 2026-09-16 from
      9091901259/90919-01259, which is the plug for the 2012-2018
      2AR-FXE engine, not this car's A25A-FXS) — Lexus 120,000 mi (only
      appears once, at the 144-month/120,000-mile line, so mileage is
      the effective trigger) — do NOT replace early
    intervalMiles: 120000
    intervalMonths: null
    service:
      parts:
        - name: Spark plugs
          oemPartNumber: 90919-01289 (Denso FC16HR-Q8)
          quantityPerService: 4
          notes: >-
            Confirmed two independent ways: parts.lexus.com's own
            listing for 2019+ ES 300h, and Toyota's dealer-facing spark
            plug cross-reference document. Gap and torque not found in
            any primary document. A secondary source cites 13 ft-lb/18
            N·m for "Lexus ES350" plugs, unconfirmed for this engine.
            Check with the parts counter or service writer when ordering.
      sources:
        - parts.lexus.com listing for 90919-01289; Toyota "09_SparkPlugs2020_hi.pdf" cross-reference document
  - itemType: battery-test
    name: >-
      12V battery load test (KONNWEI KW208 tester) — ADDED 2026-07-22:
      Brady tests every vehicle's 12V battery twice yearly (spring & fall)
      and records the CCA/SOH/SOC result each time; replacement is
      decided by the test result, not by the battery's age. No test
      logged yet for this car since purchase (2026-06-18, CORRECTED
      2026-07-22 from 2026-06-19 — the buyer's order, odometer disclosure,
      and title/loan paperwork are all dated 06/18/2026) — first one
      due this fall.
    intervalMiles: null
    intervalMonths: 6
  - itemType: battery-12v
    name: >-
      12V auxiliary battery (in trunk behind left panel) — NOT a
      manufacturer-scheduled interval (Lexus's guide gives no fixed
      replacement interval, only "replace when needed"). CORRECTED
      2026-07-22: this is an informational "last replaced" record only,
      NOT a schedule-driven due date — Brady explicitly does not want a
      replacement flagged just because the battery has crossed a generic
      age estimate. Replacement happens only when the twice-yearly KW208
      test (see battery-test above) indicates it's needed. CORRECTED
      2026-09-16: "Group 55B24R" does not appear anywhere in Lexus's
      documented ES 300h battery history for either generation and
      should not be trusted.
    intervalMiles: null
    intervalMonths: null
    service:
      parts:
        - name: 12V auxiliary battery
          notes: >-
            Sealed, maintenance-free, separate from the hybrid NiMH
            traction battery. Genuine part history for this generation
            (2019-2024) shows two candidates, 28800-31572 (Euro/EN size
            LN2, current) or 28800-38160 (LN3), and it isn't settled
            which applies to this VIN. The size code and CCA are printed
            on the battery case itself, the fastest and most definitive
            way to confirm, next time the trunk panel is off. A forum
            report cites roughly 563 CCA, unconfirmed against a spec sheet.
      sources:
        - lexuspartsnow.com OEM battery part history; parts.lexus.com fitment pages
  - itemType: hybrid-battery-fan-filter
    name: >-
      HV battery cooling intake filter — clean (behind right rear seat
      trim). CORRECTED: this IS part of the official core Lexus schedule
      for the 7th-gen (2019+) ES 300h — the 2020 ES 300h WSG lists
      "Check HV battery cooling intake filter" at every single 6 mo/
      5,000 mi visit (this item did not exist at all on the 6th-gen/2016
      schedule this file previously cited). That routine item is a
      visual check, not a full clean/service. The actual clean/service
      procedure and its ~20,000 mi interval come from TSB L-SB-0028-20
      (Aug. 2020, "HV Battery Cooling System Maintenance Service"),
      which independent sources describe as inspect-every-5,000-mi,
      clean-every-20,000-mi. UPGRADED 2026-07-23, per Brady: bumped from
      a pure 20,000 mi interval to whichever comes first against a 6-month
      cadence, matching his twice-yearly (spring/fall) check rhythm for
      other critical items — a full 7-year, 31-record CARFAX history for
      this car (see maintenance-log.yaml) shows this was NEVER done by
      either prior owner, and Brady considers it critical to hybrid
      battery performance/longevity, so a mileage-only interval that
      could stretch past a year at his driving pace isn't tight enough.
    intervalMiles: 20000
    intervalMonths: 6
