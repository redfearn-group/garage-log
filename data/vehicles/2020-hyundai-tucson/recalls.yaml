recalls:
  - campaignNumber: 20V543000
    component: >-
      SERVICE BRAKES, HYDRAULIC:ANTILOCK/TRACTION CONTROL/ELECTRONIC LIMITED SLIP:CONTROL
      UNIT/MODULE
    summary: >-
      Hyundai Motor America (Hyundai) recalled certain 2019-2021 Tucson vehicles on September 4,
      2020.  On December 30, 2020, Hyundai expanded the recall population, and added certain
      2016-2018 Tucson vehicles.  The Anti-lock Brake Hydraulic Electronic Control Unit (HECU) could
      corrode internally and cause an electrical short, possibly resulting in an engine compartment
      fire.
    reportedDate: 04/09/2020
