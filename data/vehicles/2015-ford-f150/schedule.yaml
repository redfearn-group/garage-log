# 2015 Ford F-150, 3.5L EcoBoost V6, 4WD SuperCrew.
# Intervals below are Ford's NORMAL-schedule specs (this truck is not used
# for heavy/frequent towing). Severe-duty figures — used for regular towing,
# heavy loads, sustained dusty/off-road, extended idling — are noted where
# they differ, but the numeric interval is the normal one.
#
# Sources (re-verified 2026-07-16):
#  - PRIMARY: 2015 F-150 Owner's Manual (May 2015 Third Printing), "Scheduled
#    Maintenance" chapter, pp. 501-506 — "NORMAL SCHEDULED MAINTENANCE" and
#    "SPECIAL OPERATING CONDITIONS SCHEDULED MAINTENANCE" tables, read in full
#    from the actual manual text (also mirrored on fordservicecontent.com).
#  - f150hub.com "3.5L EcoBoost F-150 Maintenance Schedule".
#  - Firestone Complete Auto Care, 2015 F-150 scheduled maintenance.
#  - ZF/community sources cited inline per-item below for the two fluids
#    Ford calls "lifetime" (transmission, axle/transfer-case) and for items
#    Ford's own schedule table does not cover at all for this model year
#    (cabin air filter, brake fluid).
#
# Prior version of this file used generic placeholder intervals (5k oil, 30k
# plugs/coolant/transmission) that were far more frequent than Ford specifies;
# corrected here to the actual Ford intervals. 2026-07-16 pass: re-verified
# every item against the actual owner's-manual text (not just aggregator
# summaries) and corrected two items whose citations turned out to be wrong
# (rear-diff-transfer-case, cabin-air-filter, brake-fluid-flush) and fixed an
# inaccurate "derived" note on coolant that Ford actually states literally.
items:
  - itemType: oil-change
    name: >-
      Oil & filter change (Motorcraft 5W-30 full synthetic, ~6 qt) — Ford
      Intelligent Oil Life Monitor; normal max 10,000 mi / 12 mo (severe/
      towing 5,000 mi / 6 mo). The turbo EcoBoost often trips the monitor
      before 10k, but do not exceed it. BRADY'S POLICY (2026-07-16): every
      car in the fleet gets a minimum of 2 oil changes/year regardless of
      mileage (spring tune-up + fall oil change) — 6 mo below reflects that
      standing policy, not Ford's own 12 mo normal-schedule allowance.
    intervalMiles: 10000
    intervalMonths: 6
  - itemType: tire-rotation
    name: Tire rotation — Ford lists this at the oil-change interval (~10,000 mi)
    intervalMiles: 10000
    intervalMonths: 12
  - itemType: multi-point-inspection
    name: Multi-point inspection (done alongside each oil-change service)
    intervalMiles: 10000
    intervalMonths: 12
  - itemType: engine-air-filter
    name: >-
      Engine air filter — UPDATED 2026-07-22: Zeus runs a K&N washable/
      reusable engine air filter (Brady declined the dealer's disposable-
      filter recommendation more than once for this reason). Brady washes
      it every spring rather than replacing it on a mileage interval — the
      30,000 mi figure below is really a "check/wash by" prompt, not a
      replacement due date. Confirmed clean and working as of 2026-07-22.
      Brady plans to switch to disposable filters starting spring 2027
      (see tasks.yaml).
    intervalMiles: 30000
    intervalMonths: null
  - itemType: cabin-air-filter
    name: >-
      Cabin air filter — CORRECTED 2026-07-16: the 2015 F-150 owner's
      manual only says "replace at regular intervals, see Scheduled
      Maintenance" but the actual Scheduled Maintenance table does NOT
      list a cabin air filter line item at all (prior version of this
      file wrongly attributed a 20,000 mi figure to Ford). 20,000 mi is
      kept as a COMMUNITY/industry-standard estimate (widely-cited
      15,000-20,000 mi range from parts retailers and independent shops),
      not an official Ford interval. UPDATED 2026-07-22: Zeus also runs a
      K&N washable/reusable cabin air filter (VF2049), washed every spring
      rather than replaced on a mileage interval — same caveat as the
      engine air filter above. Confirmed clean and working as of
      2026-07-22. Brady plans to switch to disposable filters starting
      spring 2027 (see tasks.yaml).
    intervalMiles: 20000
    intervalMonths: null
  - itemType: brake-inspection
    name: Brake inspection (pads/rotors/lines) — with each service
    intervalMiles: 10000
    intervalMonths: 12
  - itemType: battery-test
    name: >-
      12V battery load test (KONNWEI KW208 tester) — UPDATED 2026-07-22:
      Brady tests twice yearly (spring & fall), not annually, and records
      the CCA/SOH/SOC result each time. Replacement is decided by the
      test result, not by the battery's age — see battery-12v below,
      which is now informational only.
    intervalMiles: null
    intervalMonths: 6
  - itemType: battery-12v
    name: >-
      12V battery replacement — Zeus's AGM was installed 2020-10-24.
      CORRECTED 2026-07-22: this is an informational "last replaced"
      record only, NOT a schedule-driven due date — Brady explicitly does
      not want a replacement flagged just because the battery has crossed
      a generic age estimate. Replacement happens only when the twice-
      yearly KW208 test (see battery-test above) indicates it's needed.
    intervalMiles: null
    intervalMonths: null
  - itemType: wiper-blades
    name: >-
      Wiper blades — Brady checks these every spring during the seasonal
      tune-up, but only actually replaces them roughly every other year
      once they get streaky (sometimes sooner if damaged). 24 mo below
      reflects the real replacement cadence, not the annual spring check.
    intervalMiles: null
    intervalMonths: 24
  - itemType: brake-fluid-flush
    name: >-
      Brake fluid — CORRECTED 2026-07-16: the 2015 F-150 owner's manual
      has NO scheduled brake fluid change at all — only a periodic "Brake
      Fluid Check" (level/condition). Ford did not add a scheduled brake
      fluid CHANGE to the F-150's maintenance table until the 2020 model
      year (prior version of this file wrongly attributed a 3-year figure
      to this 2015 truck's own Ford schedule). UPDATED 2026-07-22: Brady's
      actual practice supersedes the calendar-estimate approach entirely.
      He tests the fluid's chemical condition twice yearly (spring and
      fall) with Phoenix Systems 8006-B strips and replaces it only if a
      test fails, never on a fixed calendar interval.
      RESTRUCTURED 2026-08-14: the test now has its own brake-fluid-test
      item below, mirroring how battery-test is kept separate from
      battery-12v. This entry is a REPLACEMENT record only and carries no
      interval, since Ford specifies no brake fluid change for this model
      year. Previously this item held a 6-month interval so strip-test
      results could be logged against it, which made a passed test render
      as though the fluid had been flushed. A "never logged" state here
      means no flush has ever been recorded, which is NOT the same as one
      being due.
    intervalMiles: null
    intervalMonths: null
  - itemType: brake-fluid-test
    name: >-
      Brake fluid condition test (Phoenix Systems 8006-B strips) — ADDED
      2026-08-14. Brady tests every vehicle in the fleet twice yearly,
      spring and fall, and replaces the fluid only on a failed result.
      The 8006-B strips are double-ended, so the same strip covers the
      coolant test below and the two are normally done in one session.
    intervalMiles: null
    intervalMonths: 6
  - itemType: coolant-flush
    name: >-
      Engine coolant (Motorcraft Orange) — Ford owner's manual, Scheduled
      Maintenance table, footnote 2: "Initial replacement at six years or
      100,000 miles, then every three years or 50,000 miles." Those
      figures are literal, direct Ford citations. UPDATED 2026-07-22:
      Brady's actual practice supersedes the calendar-estimate approach.
      He tests the coolant's chemical condition twice yearly (spring and
      fall) with Phoenix Systems strips alongside the brake fluid test
      above, and replaces it only if a test fails, not on Ford's calendar
      interval.
      RESTRUCTURED 2026-08-14: the test now has its own coolant-test item
      below. This entry is an informational REPLACEMENT record with no
      computed due date, exactly like battery-12v. Ford's figures stay
      documented in this text but are deliberately NOT set as intervals
      below, because computing against them puts this row into OVERDUE on
      the strength of the calendar while the actual fluid has passed a
      strip test. That is the precise error this restructure exists to
      remove. The real flush on record is the Tim Dahle Ford 100K
      service, which stays correctly tagged here.
    intervalMiles: null
    intervalMonths: null
  - itemType: coolant-test
    name: >-
      Engine coolant condition test (Phoenix Systems 8006-B strips) —
      ADDED 2026-08-14. Twice yearly, spring and fall, same session and
      same double-ended strip as the brake fluid test above. Replacement
      is decided by the result, not by age or mileage.
    intervalMiles: null
    intervalMonths: 6
  - itemType: transmission-fluid-service
    name: >-
      Transmission fluid (6R80, Motorcraft MERCON LV) — Ford's own normal
      schedule says 150,000 mi, which every independent source agrees is
      unrealistically long: ZF (the actual transmission manufacturer)
      specifies 8 yr/50,000 mi, and F150 forums call Ford's 150K figure "a
      terrible idea," recommending 30,000-60,000 mi. Given this truck's
      unknown prior transmission-fluid history, the interval below is set
      to ZF's own 50,000 mi/8 yr spec — the most authoritative sourced
      number in the 30-60K community range — NOT Ford's 150,000 mi figure.
    intervalMiles: 50000
    intervalMonths: 96
  - itemType: spark-plugs
    name: Spark plugs (Motorcraft, 3.5L EcoBoost) — Ford ~100,000 mi
    intervalMiles: 100000
    intervalMonths: null
  - itemType: front-axle-fluid
    name: >-
      Front axle fluid (4WD) — SPLIT 2026-07-28 from a combined "rear
      axle + transfer case + front axle" item, per Brady: each fluid now
      gets its own line so a log entry covering only one or two of the
      three can't silently mark all three "done." CORRECTED 2026-07-16:
      Ford's owner's manual normal schedule lists 150,000 mi, and Ford's
      "Exceptions" section actually classifies the synthetic-filled axles
      as lubricated FOR LIFE — no scheduled change at all, service only
      on leak or water submersion (there is no official Ford "severe-duty
      axle = 30,000 mi" figure; that was a misattribution in a prior
      version of this file). Since Ford treats axle fluid as effectively
      unscheduled, the 30,000 mi interval below is a COMMUNITY-sourced
      figure (F150 Forum/Ford-Trucks/F150online consensus, incl.
      mechanics quoted recommending a change despite the "lifetime"
      label), the most conservative well-supported community number.
      Water submersion (deep fording/flooding) calls for an immediate
      change regardless of interval.
    intervalMiles: 30000
    intervalMonths: null
  - itemType: rear-axle-fluid
    name: >-
      Rear axle fluid (4WD) — SPLIT 2026-07-28 from a combined "rear
      axle + transfer case + front axle" item, per Brady: each fluid now
      gets its own line so none of the three can be silently skipped.
      Same Ford "lifetime fluid" exception and same 30,000 mi
      community-sourced interval as front-axle-fluid above — see that
      item for full sourcing detail. Water submersion (deep fording/
      flooding) calls for an immediate change regardless of interval.
    intervalMiles: 30000
    intervalMonths: null
  - itemType: transfer-case-fluid
    name: >-
      Transfer case fluid (4WD) — SPLIT 2026-07-28 from a combined "rear
      axle + transfer case + front axle" item, per Brady: each fluid now
      gets its own line so none of the three can be silently skipped.
      Unlike the two axles, Ford's own SEVERE-duty table gives a real
      numeric figure for the transfer case specifically: 60,000 mi under
      towing/idling/dusty/off-road use (Ford's normal schedule still
      lists 150,000 mi, treated as unrealistically long by every
      independent source, same as the axles). 30,000 mi below matches
      the axles' conservative community figure rather than Ford's own
      60,000 mi severe number, since this truck sees enough towing/idling
      to reasonably run the more conservative interval. Water submersion
      (deep fording/flooding) calls for an immediate change regardless of
      interval.
    intervalMiles: 30000
    intervalMonths: null
