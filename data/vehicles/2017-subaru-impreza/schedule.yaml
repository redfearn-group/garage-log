# 2017 Subaru Impreza Premium Sedan AWD, FB20 2.0L, TR580 Lineartronic CVT.
# Intervals below are Subaru's NORMAL-schedule specs. Mileage on this car is
# high (~140K) with unknown prior service history, so items with no fixed
# "replace" interval under normal use (CVT fluid, differential) are still
# tracked here as a due-for-inspection/proactive-service item given that
# unknown history — not because Subaru mandates a replacement at that mileage.
#
# Sources (verified 2026-07-16):
#  - Subaru 2017 Impreza Owner's/Warranty & Maintenance Manual (by way of
#    aggregated citations: impreza5.com forum copy, Bowser/Freehold/Hadwin-
#    White Subaru dealer maintenance-schedule pages).
#  - Subaru official oil interval: 6,000 mi/6 mo normal (0W-20 full synthetic).
#  - Subaru brake fluid: 30 months/30,000 mi, whichever first (more frequent,
#    15 mo/15,000 mi, only in high-humidity/mountainous severe use).
#  - Subaru Super Coolant (factory fill): no first change until 11 yr/137,500
#    mi; every 6 yr/75,000 mi thereafter.
#  - Subaru CVT fluid: no scheduled replacement through 132,000 mi under
#    normal use per the warranty booklet; inspect only, at 30,000 mi
#    intervals (impreza5.com forum copy of the maintenance schedule, and
#    multiple Subaru CVT-care write-ups).
#  - Spark plugs: 60,000 mi per Subaru's normal schedule (FB-series iridium
#    plugs; do not replace early).
#  - Cabin air filter: 12,000 mi/12 mo, confirmed across multiple
#    independent dealer maintenance-schedule pages (corrected from a prior
#    15,000 mi figure that wasn't as well corroborated).
#  - Front & rear differential fluid: inspect at 30,000 mi intervals per
#    Subaru's normal schedule (severe duty 15,000 mi); community proactive
#    replacement figure 50,000-60,000 mi; see DRIVELINE COMPONENT AUDIT below
#    for why these are two separate items.
#  - Subaru Canada official maintenance guide (subaru.ca, Vehicle
#    Maintenance / Maintenance Guide page): explicitly lists BOTH "CVT
#    fluid (except BRZ)" AND "Front/Rear Differential Gear Oil (except
#    BRZ)" at a recommended replacement of 110,000 km / 66 months
#    (~68,000 mi) — a real official non-US-market Subaru interval, not a
#    forum guess. This directly confirms Brady's hypothesis that these
#    "lifetime fluid" community intervals largely trace back to real
#    factory schedules Subaru publishes outside the US.
#
# Prior version of this file used a 5,000 mi oil interval and a 35,000 mi
# "CVT fluid drain & fill" figure that were both off — corrected here. The
# CVTF-II-only fluid warning (never the orange High Torque CVTF) is kept
# since it's a real, distinct hazard, not a manufacturer interval question.
#
# DRIVELINE COMPONENT AUDIT (2026-07-16, corrected same day after a first
# pass got this wrong): this is a CVT (TR580 Lineartronic) car, not a
# manual-transmission Impreza. VERIFIED via multiple independent forum
# how-to threads (subaruoutback.org, impreza5.com, NASIOC) describing the
# actual service procedure: the FRONT differential on the TR580, despite
# being housed within the same transmission casing as the CVT variator, has
# its OWN separate fill plug (passenger-side 8mm Allen), drain plug (Torx
# T70), and level/check port — it takes ~1.3-1.35 qt of 75W-90 gear oil,
# completely distinct from CVT fluid (CVTF-II), and is NOT topped off or
# serviced by a CVT fluid change. An earlier pass on this file incorrectly
# concluded the front diff shares CVT fluid, based on unverified general
# knowledge during a tool outage — that was wrong and has been corrected.
# The REAR differential is a separate housing entirely (fed by the
# propeller shaft) with its own fill/drain, also 75W-90 gear oil. So there
# ARE two genuinely separate differential service items (front + rear),
# each getting its own itemType below, matching Brady's original
# expectation. The AWD torque-split TRANSFER CLUTCH, by contrast, is a wet
# multi-plate clutch pack inside the CVT's extension housing with no
# separate fill of its own — it IS lubricated by the CVT fluid, so it does
# NOT get a separate schedule item; a CVT fluid change already covers it.
# Corroborated by maintenance-log.yaml: Brady bought a case of 4 qt of
# Valvoline 75W-90 gear oil — more than the ~1 qt a single differential
# needs, but right for filling both front (~1.35 qt) AND rear (~1 qt) diffs
# from one purchase, which only makes sense if both are real separate fills.
# JAPAN INTERVAL: multiple independent forum threads (thesubaruforums.com,
# subaruxvforum.com, bobistheoilguy.com) consistently reference a Japan-
# market CVT fluid interval in the 30,000-36,000 mi/km range, distinctly
# shorter than the US "no scheduled replacement" stance — no single primary
# JDM manual PDF was located, so treat the exact figure (30k vs 36k, mi vs
# km ambiguity across secondary sources) as corroborated-but-imprecise,
# stronger than a bare forum guess but short of a directly-read citation.
items:
  - itemType: oil-change
    name: >-
      Oil & filter change (0W-20 full synthetic) — Subaru normal 6,000
      mi/6 mo. Already satisfies Brady's fleet-wide minimum-2x/year policy
      (2026-07-16) without any adjustment needed.
    intervalMiles: 6000
    intervalMonths: 6
    service:
      fluids:
        - name: Engine oil
          grade: 0W-20 full synthetic
          certifications: [ILSAC GF-5, API SN Resource Conserving]
          capacity: 4.7 US qt (4.4 L) with filter change
          notes: 5W-30 conventional is only a temporary substitute if 0W-20 isn't available.
      parts:
        - name: Oil filter
          oemPartNumber: 15208AA21A
          notes: >-
            CORRECTED 2026-09-16: 15208AA21A is correct for this FB20
            Impreza. 15208AA12A, which appeared in this repo's history,
            is a genuine Subaru part but fits 2009-2012 Legacy/Outback
            EJ25 engines, not the FB20. Both use the same 3/4-16 UNF
            thread, so a wrong filter would thread on without an
            obvious leak, but the media/bypass valve spec doesn't match.
        - name: Oil drain plug bolt
          oemPartNumber: 807016210
          notes: M16 x 1.5 thread.
        - name: Oil drain plug crush washer
          oemPartNumber: 803916010
          singleUse: true
          notes: >-
            CORRECTED 2026-09-16: this is the correct washer for the
            engine oil pan drain plug, shared with the CVT pan drain
            plug. 803918060, which the 2026-04-08 oil-change log records
            as installed here, is a different, larger gasket (18mm ID
            vs this washer's 16mm ID) used on the CVT fill plug and
            differential fill plugs, not the engine oil drain bolt.
            Check what's actually on the drain plug at the next oil
            change and correct it to 803916010 if needed. Toyota's
            90430-12031 (used on the Lexus and Highlander) is NOT
            interchangeable here, it's an M12 washer for an M12 bolt,
            while this car's drain bolt is M16 x 1.5.
      sources:
        - 2017 Impreza Owner's Manual, Specifications, p. 429-430
        - parts.subaru.com fitment listings for 15208AA21A, 15208AA12A, 807016210, 803916010, 803918060
  - itemType: tire-rotation
    name: >-
      Tire rotation — normally done at each oil-change service.
      DEFERRED 2026-08-14, per Brady: this row reads overdue because the
      6,000 mi trigger passed at 139,173 mi and the car was already at
      141,162 mi on 2026-07-26. That is a deliberate decision, not a
      missed service. Draco is no longer Brady's daily commuter and is now
      accumulating roughly 700 mi/month, so the uneven tire wear this
      interval exists to prevent is building far more slowly than the
      mileage number by itself suggests. The rotation moves to the fall
      tune-up so it happens in one session with the rest of the fall work.
      The 2026-07-26 oil change was logged without an accompanying
      rotation, which is why oil reads OK here while this row does not.
      Do NOT treat the overdue flag as an action item before the fall
      service. The interval itself is unchanged and still correct, since
      what changed is the driving pattern, not the right rotation spacing.
      See tasks.yaml #19.
    intervalMiles: 6000
    intervalMonths: 6
    service:
      parts:
        - name: Tires
          notes: >-
            OEM size for this 2.0i Premium Sedan is P205/55R16 89V (16"
            wheel), the base fitment of three trim-dependent options in
            the owner's manual. Cold pressure: front 33 psi (230 kPa),
            rear 32 psi (220 kPa). Wheel lug nut torque: 89 ft-lb (120
            N·m). All three confirmed directly in the owner's manual.
      sources:
        - 2017 Impreza Owner's Manual, Specifications, p. 432
  - itemType: cabin-air-filter
    name: Cabin air filter — Subaru ~12,000 mi/12 mo
    intervalMiles: 12000
    intervalMonths: 12
    service:
      parts:
        - name: Cabin air filter
          oemPartNumber: 72880FG000
          notes: >-
            Confirmed via a 2017 Impreza-specific parts.subaru.com
            listing. 72880FJ000 is a different, newer part for
            2018-2021 Forester/STI/WRX/Crosstrek, not this car.
      sources:
        - parts.subaru.com listing for the 2017 Impreza
  - itemType: engine-air-filter
    name: Engine air filter — Subaru ~30,000 mi (some sources cite 20,000; using the more conservative 30,000 confirmed by the multi-source schedule)
    intervalMiles: 30000
    intervalMonths: null
    service:
      parts:
        - name: Engine air filter
          oemPartNumber: 16546AA16A
          notes: >-
            Confirmed via a 2017 Impreza-specific parts.subaru.com
            listing. K&N KNA-5064, already on hand per maintenance-log.yaml
            (2026-03-14), is a compatible washable/reusable alternative,
            not a fitment conflict.
      sources:
        - parts.subaru.com listing for the 2017 Impreza
  - itemType: brake-inspection
    name: Brake inspection (pads/rotors) — with each service
    intervalMiles: 6000
    intervalMonths: 6
  - itemType: brake-fluid-flush
    name: >-
      Brake fluid — Subaru 30 months/30,000 mi, whichever comes first.
      RESTRUCTURED 2026-08-14: this is a REPLACEMENT record. Brady decides
      replacement from twice-yearly Phoenix Systems strip tests, not from
      Subaru's calendar figure, so this is an informational record with no
      computed due date, exactly like battery-12v. Subaru's figures stay
      documented in this text but are deliberately NOT set as intervals
      below, since computing against them flags the row on the calendar
      while the actual fluid has passed a strip test. The post-purchase
      strip test previously logged against this item has been retagged to
      brake-fluid-test below, where it belongs: a passed test is not a
      flush.
    intervalMiles: null
    intervalMonths: null
    service:
      fluids:
        - name: Brake fluid
          grade: DOT 3 or DOT 4, fresh (FMVSS No. 116)
          notes: >-
            Subaru ships DOT 3 from the factory but explicitly approves
            DOT 4, the two are chemically compatible and can be mixed.
            NEVER use DOT 5: it's silicone-based, not glycol-based like
            DOT 3/4/5.1, and is incompatible with this car's ABS
            hydraulic system, it can swell seals and aerate the fluid.
            The name is the trap: DOT 5.1 is a fine, compatible glycol
            fluid despite sounding like a small step up from DOT 5,
            which is a completely different, incompatible chemistry.
      sources:
        - 2017 Impreza Owner's Manual, Specifications, p. 431
  - itemType: brake-fluid-test
    name: >-
      Brake fluid condition test (Phoenix Systems 8006-B strips) — ADDED
      2026-08-14. Brady tests every vehicle in the fleet twice yearly,
      spring and fall, and replaces the fluid only on a failed result.
      The 8006-B strips are double-ended, so the same strip covers the
      coolant test below and the two are normally done in one session.
    intervalMiles: null
    intervalMonths: 6
  - itemType: cvt-fluid
    name: >-
      CVT fluid — Subaru CVTF-II ONLY (green, SOA427V1660/SOA427V1610).
      NEVER the orange High Torque CVTF (SOA748V0200) — that's for turbo
      Forester/Legacy/Outback H-6/WRX with the TR690, chemically different,
      wrong fluid is a documented cause of CVT damage/failure. Confirm the
      bottle says CVTF-II before pouring anything in. Subaru's normal
      schedule doesn't call for a fluid change through 132,000 mi (inspect
      only, every 30,000 mi) — the interval below is a proactive
      drain-and-fill given this car's unknown prior service history, not a
      manufacturer-mandated replacement. This service also covers the AWD
      transfer clutch pack, which is lubricated by CVT fluid with no
      separate fill of its own (see DRIVELINE COMPONENT AUDIT above) — but
      does NOT cover the front differential, which has its own separate
      75W-90 gear oil fill (see front-differential-fluid below). COMMUNITY
      NOTE: independent CVT shops report the US "lifetime fluid" line
      causes a dramatically higher CVT failure rate without service.
      Subaru Canada's OFFICIAL maintenance guide (subaru.ca) lists CVT
      fluid replacement at 110,000 km/66 months (~68,000 mi) — a real
      factory interval, not a forum guess. Separately, multiple forum
      threads reference a shorter Japan-market interval of roughly
      30,000-36,000 mi/km (exact figure not pinned to a primary JDM
      document, but corroborated across several independent threads) —
      the 30,000 mi figure below leans toward that more conservative JDM
      range given this car's unknown prior service history at ~140K mi.
    intervalMiles: 30000
    intervalMonths: null
    service:
      fluids:
        - name: CVT fluid
          grade: Subaru CVTF-II, green
          notes: >-
            SOA427V1660 or SOA427V1610 ONLY. Never SOA748V0200 (orange
            High Torque CVTF, for turbo Forester/Legacy/Outback/WRX with
            the TR690), which is chemically different and a documented
            cause of CVT damage. Total system capacity is 11.3 US qt
            per the owner's manual, but that's not what a drain-and-fill
            takes. No exact FSM drain-and-fill figure was found; DIY
            writeups for this TR580 consistently report draining 5-6 qt
            from the pan and refilling to the check-plug level (8mm
            hex), not to a fixed quart count. Budget 6 qt on hand.
            Drain plug is 14mm hex/socket.
      sources:
        - 2017 Impreza Owner's Manual, Specifications, p. 429
        - Subaru Outback Forums and Impreza Forum DIY threads on TR580 CVT fluid changes
  - itemType: front-differential-fluid
    name: >-
      Front differential fluid — 75W-90 gear oil (~1.3-1.35 qt), API GL-5.
      Despite being housed within the same case as the CVT, this has its
      OWN separate fill (passenger-side 8mm Allen plug), drain (Torx T70),
      and level/check port — it is NOT topped off or serviced by a CVT
      fluid change (see DRIVELINE COMPONENT AUDIT above). Inspect at
      30,000 mi intervals per Subaru's normal schedule; replace only if
      contaminated or under severe use. COMMUNITY NOTE: Subaru Canada's
      official guide lists front/rear differential gear oil at 110,000
      km/66 months (~68,000 mi) — a real factory interval, not a forum
      guess. Severe-duty US spec already calls for a 15,000 mi change;
      forum consensus for normal-use proactive replacement (not just
      inspection) clusters around 50,000-60,000 mi with synthetic gear
      oil, given this car's unknown prior service history.
    intervalMiles: 30000
    intervalMonths: null
    service:
      fluids:
        - name: Front differential gear oil
          grade: SUBARU Extra MT (branded 75W-90 GL-5, same spec as generic 75W-90 gear oil)
          capacity: 1.4 US qt (1.3 L), confirmed via the owner's manual, slightly above the ~1.3-1.35 qt prior estimate
          notes: >-
            "Extra MT" is Subaru's brand name for a 75W-90 GL-5 gear
            oil, not a different or manual-transmission-only spec. The
            Valvoline 75W-90 GL-5 already on hand is correct, this car
            has no clutch-type limited-slip diff, so the separate
            "80W90 LSD" friction-modified product is not needed.
      sources:
        - 2017 Impreza Owner's Manual, Specifications, p. 430
  - itemType: rear-differential-fluid
    name: >-
      Rear differential fluid — 75W-90 gear oil (~1 qt), a fully separate
      housing at the rear axle fed by the propeller shaft, with its own
      fill/drain. Inspect at 30,000 mi intervals per Subaru's normal
      schedule; replace only if contaminated or under severe use.
      COMMUNITY NOTE: Subaru Canada's official guide lists front/rear
      differential gear oil at 110,000 km/66 months (~68,000 mi) — a real
      factory interval, not a forum guess. Severe-duty US spec already
      calls for a 15,000 mi change; forum consensus for normal-use
      proactive replacement (not just inspection) clusters around
      50,000-60,000 mi with synthetic gear oil, given this car's unknown
      prior service history. Same service visit as front-differential-fluid
      above (both use the same 75W-90 gear oil Brady already has on hand),
      but tracked as a separate item so neither gets silently skipped.
    intervalMiles: 30000
    intervalMonths: null
    service:
      fluids:
        - name: Rear differential gear oil
          grade: 75W-90 GL-5
          capacity: 0.8 US qt (0.8 L), confirmed via the owner's manual, slightly below the ~1 qt prior estimate
          notes: Same Valvoline 75W-90 GL-5 already on hand as the front differential.
      sources:
        - 2017 Impreza Owner's Manual, Specifications, p. 430
  - itemType: coolant-flush
    name: >-
      Engine coolant (Subaru Super Coolant, factory long-life green) — no
      first change until 11 yr/137,500 mi, then every 6 yr/75,000 mi
      thereafter — do NOT change early or mix with other coolant types.
      RESTRUCTURED 2026-08-14: this is an informational REPLACEMENT record
      with no computed due date, like battery-12v. The post-purchase strip
      test previously logged against it has been retagged to coolant-test
      below. Subaru's figures stay documented in this text; on this car
      they are genuinely far off anyway, so the strip test is the only
      thing that should prompt action.
    intervalMiles: null
    intervalMonths: null
  - itemType: coolant-test
    name: >-
      Engine coolant condition test (Phoenix Systems 8006-B strips) —
      ADDED 2026-08-14. Twice yearly, spring and fall, same session and
      same double-ended strip as the brake fluid test above. Replacement
      is decided by the result, not by age or mileage.
    intervalMiles: null
    intervalMonths: 6
  - itemType: wiper-blades
    name: >-
      Wiper blades — Brady checks these every spring during the seasonal
      tune-up, but only actually replaces them roughly every other year
      once they get streaky (sometimes sooner if damaged). 24 mo below
      reflects the real replacement cadence, not the annual spring check.
    intervalMiles: null
    intervalMonths: 24
  - itemType: spark-plugs
    name: Spark plugs (iridium, FB20 chain engine, no timing belt) — Subaru normal 60,000 mi; do not replace early
    intervalMiles: 60000
    intervalMonths: null
    service:
      parts:
        - name: Spark plugs
          oemPartNumber: 22401AA880
          aftermarketCrosses: [NGK DILKAR7B8]
          quantityPerService: 4
          notes: >-
            NGK DILKAR7B8 is directly named in the owner's manual
            itself, the strongest possible confirmation. Gap 0.8mm,
            pre-set at the factory on this laser-iridium plug, do not
            adjust, doing so risks damaging the fine center electrode.
            Torque not found in a confirmed FSM source, secondary
            sources cluster around 13-17 ft-lb. Reduce torque by
            roughly a third if using anti-seize, though NGK says it
            isn't required on these plated threads.
      sources:
        - 2017 Impreza Owner's Manual, Specifications, p. 432
        - parts.subaru.com listing for 22401AA880
  - itemType: battery-test
    name: >-
      12V battery load test (KONNWEI KW208 tester) — UPDATED 2026-07-22:
      Brady tests twice yearly (spring & fall), not annually, and records
      the CCA/SOH/SOC result each time. Replacement is decided by the
      test result, not by the battery's age.
    intervalMiles: null
    intervalMonths: 6
    service:
      parts:
        - name: 12V battery
          notes: >-
            Genuine Subaru spec JIS 75D23L, confirmed directly in both
            the owner's manual and a 2017 Impreza-specific parts.subaru.com
            listing (82110FL01A). For US retail shopping, AutoZone's
            fitment tool lists this as BCI Group 35, 585 CCA, EFB.
            Some generic "Impreza" battery finders show Group 25 or
            26R, those reflect other model years/trims, not this VIN.
      sources:
        - 2017 Impreza Owner's Manual, Specifications, p. 432
        - parts.subaru.com listing for 82110FL01A
